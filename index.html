<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Drive, ride and sail the real Earth, built from open map data." />
  <title>EarthRacer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232f6fb0'/%3E%3Cpath d='M10 38h44M14 30h36' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='44' r='6' fill='%23f4c430'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%23f4c430'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="where">
      <div id="street"></div>
      <div id="area"></div>
      <div id="radio" hidden></div>
      <div id="sidepops"></div>
    </div>
    <div id="midcol"><div id="task" hidden></div><div id="toasts"></div></div>
    <div id="banner"></div>
    <div id="style"></div>
    <div id="mapwrap"><canvas id="minimap" width="320" height="320"></canvas><div id="weather"></div></div>
    <div id="dash">
      <div id="speed"><b>0</b><span>km/h</span></div>
      <div id="limit"></div>
      <div id="bars"><div class="bar" id="fuelbar"><i></i><label>⛽</label></div><div class="bar" id="dmgbar"><i></i><label>🔧</label></div></div>
      <div><span id="coins"></span><span id="gscore" hidden></span></div>
    </div>
    <div id="topbtns">
      <button id="b-menu" title="Menu (Esc)">☰</button>
      <button id="b-cam" title="Camera (C)">🎥</button>
      <button id="b-radio" title="Radio: next station (V)">📻</button>
      <button id="b-guess" hidden title="Guess where you are (G)">🎲<span> Guess</span></button>
      <button id="b-trip" hidden title="Take a trip (T)">🚉<span> Take a trip</span></button>
      <button id="b-fuel" hidden title="Out of fuel">⛽<span> Help</span></button>
    </div>
    <div id="controls"></div>
  </div>

  <div id="watch" hidden><div class="porthole"></div><div class="wbar"><span id="winfo"></span><button id="wback">Back to the trip</button></div></div>
  <div id="overlay"></div>
  <div id="panel" hidden></div>
  <div id="rotate" hidden>Turn your phone sideways for the best view</div>

  <script type="module" src="/src/boot.js"></script>
</body>
</html>
