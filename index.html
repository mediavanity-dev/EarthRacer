<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Drive, ride and sail the real Earth, built from open map data." />
  <title>EarthRacer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232f6fb0'/%3E%3Cpath d='M10 38h44M14 30h36' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='44' r='6' fill='%23f4c430'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%23f4c430'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="where">
      <div id="street"></div>
      <div id="area"></div>
      <div id="radio" hidden></div>
      <div id="sidepops"></div>
    </div>
    <div id="midcol"><div id="task" hidden></div><div id="toasts"></div></div>
    <div id="banner"></div>
    <div id="style"></div>
    <div id="mapwrap"><canvas id="minimap" width="320" height="320"></canvas><div id="weather"></div></div>
    <div id="dash">
      <div id="speed"><b>0</b><span>km/h</span></div>
      <div id="limit"></div>
      <div id="bars"><div class="bar" id="fuelbar"><i></i><label>⛽</label></div><div class="bar" id="dmgbar"><i></i><label>🔧</label></div></div>
      <div><span id="coins"></span><span id="gscore" hidden></span></div>
    </div>
    <div id="topbtns">
      <button id="b-menu" title="Menu (Esc)">☰</button>
      <button id="b-cam" title="Camera (C)">🎥</button>
      <button id="b-radio" title="Radio: next station (V)">📻</button>
      <button id="b-horn" title="Horn (H)">📯</button>
      <button id="b-guess" hidden title="Guess where you are (G)">🎲<span> Guess</span></button>
      <button id="b-trip" hidden title="Take a trip (T)">🚉<span> Take a trip</span></button>
      <button id="b-fuel" hidden title="Out of fuel">⛽<span> Help</span></button>
      <button id="b-auto" hidden title="Autopilot (P)">🤖<span> Autopilot</span></button>
    </div>
    <div id="controls"></div>
  </div>

  <div id="skydive" hidden>
    <svg class="diver" viewBox="-60 -70 120 140" aria-hidden="true">
      <g class="canopy">
        <path d="M-54,-62 Q0,-76 54,-62 L50,-36 Q0,-46 -50,-36 Z" fill="#e8453c" stroke="#7a1f1a" stroke-width="2"/>
        <path d="M-32,-67 L-30,-40 M-11,-70 L-10,-43 M11,-70 L10,-43 M32,-67 L30,-40" stroke="#ffd84a" stroke-width="7" opacity="0.9"/>
        <path d="M-48,-38 L-8,8 M48,-38 L8,8 M-20,-44 L-5,8 M20,-44 L5,8" stroke="#f4f4f4" stroke-width="1" opacity="0.8"/>
      </g>
      <g class="jumper">
        <g class="arm l"><path d="M-6,-6 L-30,-22" stroke="#2f6fb0" stroke-width="9" stroke-linecap="round"/><circle cx="-31" cy="-23" r="5" fill="#d7a985"/></g>
        <g class="arm r"><path d="M6,-6 L30,-22" stroke="#2f6fb0" stroke-width="9" stroke-linecap="round"/><circle cx="31" cy="-23" r="5" fill="#d7a985"/></g>
        <g class="leg l"><path d="M-5,18 L-20,44" stroke="#22303f" stroke-width="10" stroke-linecap="round"/><ellipse cx="-21" cy="47" rx="6" ry="4" fill="#111"/></g>
        <g class="leg r"><path d="M5,18 L20,44" stroke="#22303f" stroke-width="10" stroke-linecap="round"/><ellipse cx="21" cy="47" rx="6" ry="4" fill="#111"/></g>
        <rect x="-12" y="-12" width="24" height="34" rx="11" fill="#2f6fb0"/>
        <rect x="-9" y="-4" width="18" height="16" rx="4" fill="#f2b632"/>
        <circle cx="0" cy="-17" r="10" fill="#e8453c"/><circle cx="0" cy="-17" r="10" fill="none" stroke="#7a1f1a" stroke-width="1.5"/>
      </g>
    </svg>
    <div class="say" id="sksay"></div>
    <div class="skbar"><b id="skalt"></b><span id="skhint"></span><i><em id="sktime"></em></i></div>
  </div>
  <div id="watch" hidden><div class="porthole"></div><div class="wbar"><span id="winfo"></span><button id="wback">Back to the trip</button></div></div>
  <div id="overlay"></div>
  <div id="panel" hidden></div>
  <div id="rotate" hidden>Turn your phone sideways for the best view</div>

  <script type="module" src="/src/boot.js"></script>
</body>
</html>
